[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-citation-evals"
version = "0.1.0"
description = "End-to-end RAG system with verifiable chunk-level citations, hybrid retrieval, and systematic evals."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tanmay Srivastava", email = "tanmay.w119@gmail.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "google-genai>=2.30.1",
  "rank-bm25>=0.2.2",
  "pypdf>=4.0.0",
  "python-dotenv>=1.0.0",
  "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]
ui = [
  "streamlit>=1.30.0"
]

[tool.setuptools.packages.find]
where = ["src"]
