[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-citation-evals"
version = "0.3.5"
description = "Grounded RAG pipeline with citation verification and evaluation suite"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "TANMAY", email = "tanmay.w119@gmail.com"}]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
